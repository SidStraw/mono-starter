name: Dependency maintenance
on:
  schedule:
    - cron: '0 4 * * *'
      timezone: Asia/Taipei
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-controller
  cancel-in-progress: false
jobs:
  renovate:
    if: vars.MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install trusted controller
        run: |
          mkdir -p .toolchain/bin
          npm install --prefix .toolchain --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "pnpm@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
          ln -sf "../node_modules/@pnpm/exe.$(node -p 'process.platform + "-" + process.arch')/pnpm" .toolchain/bin/pnpm
          ln -sf ../../node_modules/.bin/node .toolchain/bin/node
          export PATH="$PWD/.toolchain/bin:$PATH"
          pnpm install --frozen-lockfile
          echo "$PWD/.toolchain/bin" >> "$GITHUB_PATH"
      - name: Run Renovate versions and lockfile maintenance
        env:
          MAINTENANCE_APP_ID: ${{ vars.MAINTENANCE_APP_ID }}
          MAINTENANCE_INSTALLATION_ID: ${{ vars.MAINTENANCE_INSTALLATION_ID }}
          MAINTENANCE_APP_PRIVATE_KEY: ${{ secrets.MAINTENANCE_APP_PRIVATE_KEY }}
          RENOVATE_GIT_AUTHOR: ${{ vars.MAINTENANCE_GIT_AUTHOR }}
        run: node maintenance/run-renovate.mjs
