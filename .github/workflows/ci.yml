name: Starter CI
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: (github.event_name != 'pull_request_target' || github.event.pull_request.base.ref == github.event.repository.default_branch) && (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    name: starter/${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - id: macos-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm runner architecture
        env:
          EXPECT_PLATFORM: ${{ matrix.platform }}
          EXPECT_ARCH: ${{ matrix.arch }}
        run: node -e 'if(process.platform!==process.env.EXPECT_PLATFORM||process.arch!==process.env.EXPECT_ARCH)process.exit(1)'
      - name: Install trusted controller
        working-directory: controller
        run: |
          mkdir -p .toolchain/bin
          npm install --prefix .toolchain --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "pnpm@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
          ln -sf "../node_modules/@pnpm/exe.$(node -p 'process.platform + "-" + process.arch')/pnpm" .toolchain/bin/pnpm
          ln -sf ../../node_modules/.bin/node .toolchain/bin/node
          export PATH="$PWD/.toolchain/bin:$PATH"
          pnpm install --frozen-lockfile
          echo "$PWD/.toolchain/bin" >> "$GITHUB_PATH"
      - name: Prepare candidate
        working-directory: controller
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          UPDATER_PR: ${{ github.event.pull_request.user.type == 'Bot' }}
        run: |
          export PATH="$PWD/.toolchain/bin:$PATH"
          node maintenance/prepare-candidate.mjs ../candidate "$CANDIDATE_HEAD" "$CANDIDATE_BASE"
          cd ../candidate
          mkdir -p .toolchain/bin
          npm install --prefix .toolchain --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "pnpm@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
          ln -sf "../node_modules/@pnpm/exe.$(node -p 'process.platform + "-" + process.arch')/pnpm" .toolchain/bin/pnpm
          ln -sf ../../node_modules/.bin/node .toolchain/bin/node
          export PATH="$PWD/.toolchain/bin:$PATH"
          pnpm install --frozen-lockfile
          echo "$PWD/.toolchain/bin" >> "$GITHUB_PATH"
          pnpm exec playwright install --with-deps chromium
      - name: Supply-chain gates
        working-directory: candidate
        run: |
          export PATH="$PWD/.toolchain/bin:$PATH"
          pnpm audit --prod --audit-level high
      - name: Compatibility checks
        working-directory: candidate
        run: |
          export PATH="$PWD/.toolchain/bin:$PATH"
          pnpm exec vp run --no-cache check-all test-all
      - name: Verify lockfile unchanged
        working-directory: candidate
        run: git diff --exit-code -- package.json 'apps/*/package.json' 'packages/*/package.json' pnpm-lock.yaml pnpm-workspace.yaml
  verification:
    name: starter/aggregate
    if: always() && (github.event_name != 'pull_request_target' || github.event.pull_request.base.ref == github.event.repository.default_branch) && (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: [verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Install trusted aggregate controller
        run: |
          mkdir -p .toolchain/bin
          npm install --prefix .toolchain --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "pnpm@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
          ln -sf "../node_modules/@pnpm/exe.$(node -p 'process.platform + "-" + process.arch')/pnpm" .toolchain/bin/pnpm
          ln -sf ../../node_modules/.bin/node .toolchain/bin/node
          export PATH="$PWD/.toolchain/bin:$PATH"
          pnpm install --frozen-lockfile
          echo "$PWD/.toolchain/bin" >> "$GITHUB_PATH"
      - name: Aggregate actual job conclusions
        env:
          GH_READ_TOKEN: ${{ github.token }}
          REQUIRED_MATRIX_RESULT: ${{ needs.verify.result }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAINTENANCE_APP_ID: ${{ vars.MAINTENANCE_APP_ID }}
          MAINTENANCE_INSTALLATION_ID: ${{ vars.MAINTENANCE_INSTALLATION_ID }}
          MAINTENANCE_APP_PRIVATE_KEY: ${{ secrets.MAINTENANCE_APP_PRIVATE_KEY }}
        run: node maintenance/report-gate.mjs
